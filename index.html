<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#222;
  --border:#2e2e2e; --border2:rgba(255,255,255,0.13);
  --text:#f0ede8; --text2:#8C8880; --text3:#575450;
  --accent:#d4ff4e; --accent-dim:#a8cc3e; --accent-dark:#1e2a06;
  --green:#4ADE80; --green-bg:rgba(74,222,128,0.12);
  --red:#F87171; --red-bg:rgba(248,113,113,0.12);
  --blue:#60A5FA;
  --radius:14px; --radius-sm:10px;
  --mono:'DM Mono',monospace; --display:'Bebas Neue',sans-serif; --body:'DM Sans',sans-serif;
}
[data-theme="light"] {
  --bg:#F5F4F0; --surface:#fff; --surface2:#EEECEA;
  --border:rgba(0,0,0,0.08); --border2:rgba(0,0,0,0.14);
  --text:#1A1917; --text2:#6B6860; --text3:#A8A49E;
  --accent:#5a8a00; --accent-dim:#3d6000; --accent-dark:#e8f5c8;
  --green:#16A34A; --green-bg:#DCFCE7;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:var(--bg);font-family:var(--body);color:var(--text);overflow-x:hidden}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:40px}

.header{padding:20px 20px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.header-left{flex:1}
.header-left h1{font-family:var(--display);font-size:48px;letter-spacing:1px;line-height:1}
.header-left h1 span{color:var(--accent)}
.header-sub{font-size:12px;color:var(--text3);margin-top:4px;font-family:var(--mono)}
.header-right{display:flex;gap:8px;align-items:center;padding-top:4px}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border2);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.icon-btn:active{transform:scale(0.9)}

.clockbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm)}
.cb-date{font-size:12px;color:var(--text3);font-family:var(--mono)}
.cb-time{font-size:14px;font-weight:600;font-family:var(--mono)}

.period-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;font-family:var(--mono);border:1px solid}
.period-pill.morning{background:#1a1500;border-color:#4a3c00;color:#d4a017}
.period-pill.afternoon{background:#0d1a2e;border-color:#1a3a5c;color:#5c9ee6}
.pill-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

.arc-wrapper{display:flex;flex-direction:column;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px 18px;position:relative;overflow:hidden}
.arc-wrapper::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent)}
.arc-svg{width:180px;height:180px;overflow:visible}
.arc-track{fill:none;stroke:var(--border);stroke-width:12;stroke-linecap:round}
.arc-fill{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 0.8s cubic-bezier(0.34,1.2,0.64,1)}
.arc-fill.complete{filter:drop-shadow(0 0 8px #d4ff4e99)}
.arc-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-62%);text-align:center;pointer-events:none}
.arc-pct{font-family:var(--display);font-size:58px;line-height:1;color:var(--text);transition:color 0.3s}
.arc-pct.complete{color:var(--accent)}
.arc-lbl-bot{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:4px}
.arc-bottom{display:flex;justify-content:space-between;width:100%;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.arc-stat{text-align:center;flex:1}
.as-val{font-family:var(--display);font-size:24px;color:var(--text);line-height:1}
.as-val.accent{color:var(--accent)}
.as-lbl{font-size:10px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
.arc-div{width:1px;background:var(--border)}

.goal-row{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0}
.goal-label{font-size:12px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.5px}
.goal-controls{display:flex;align-items:center}
.goal-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center}
.goal-btn:hover{border-color:var(--accent)}
.goal-num{font-family:var(--display);font-size:28px;color:var(--accent);width:52px;text-align:center}

.list-section{padding:12px 20px 0;flex:1}
.section-title{font-size:11px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px}
.item-wrap{margin-bottom:8px;position:relative;overflow:hidden;border-radius:var(--radius)}
.hint-bg{position:absolute;inset:0;border-radius:var(--radius);display:flex;align-items:center;padding:0 20px;pointer-events:none;opacity:0}
.hint-done{background:var(--green);justify-content:flex-start}
.hint-icon{font-size:20px;color:#fff;font-weight:700}
.item{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px}
.push-num{font-family:var(--display);font-size:32px;color:var(--text3);line-height:1;width:36px;text-align:center;flex-shrink:0}
.push-body{flex:1;min-width:0}
.push-label{font-size:13px;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.5px}
.swipe-arrow{font-size:20px;color:var(--text3)}



.celebration{margin:14px 20px 0;background:var(--accent-dark);border:1px solid var(--accent-dim);border-radius:var(--radius);padding:18px;text-align:center;display:none;animation:slideIn 0.4s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px) scale(0.97)}to{opacity:1;transform:none}}
.cel-icon{font-size:32px;margin-bottom:6px}
.cel-msg{font-size:20px;font-weight:700;color:var(--accent);font-family:var(--display);letter-spacing:0.5px}
.cel-sub{font-size:12px;color:var(--accent-dim);margin-top:3px;font-family:var(--mono)}

.history-section{padding:14px 20px 0}
.history-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.history-card h3{font-size:12px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px}
.history-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.history-input{border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 12px;font-size:14px;font-family:var(--mono);background:var(--surface2);color:var(--text);outline:none;min-width:0}
.history-input:focus{border-color:var(--accent)}
.history-input.date-inp{flex:1}
.history-input.num-inp{width:72px;flex-shrink:0}
.btn-save{padding:9px 14px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#0f0f0f;font-size:13px;font-weight:700;font-family:var(--mono);cursor:pointer;flex-shrink:0}
.btn-save:active{opacity:0.8}
.history-log{margin-top:10px;max-height:180px;overflow-y:auto}
.hlog-entry{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;gap:8px}
.hlog-entry:last-child{border-bottom:none}
.hlog-date{color:var(--text3);font-family:var(--mono);font-size:12px;flex:1}
.hlog-count{font-family:var(--display);font-size:20px;color:var(--accent);flex-shrink:0}
.hlog-goal{font-size:11px;color:var(--text3);font-family:var(--mono);flex-shrink:0}
.hlog-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:2px 4px;opacity:0.5;flex-shrink:0}
.hlog-del:hover{opacity:1;color:var(--red)}

.actions-row{padding:14px 20px 0;display:flex;gap:8px}
.btn-action{flex:1;padding:11px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:12px;font-family:var(--mono);cursor:pointer;text-align:center}
.btn-action:hover{border-color:var(--accent-dim);color:var(--accent)}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);font-size:13px;font-weight:500;padding:8px 18px;border-radius:20px;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-left">
      <h1>PUSH<span>UP</span></h1>
      <div class="header-sub" id="header-sub">yükleniyor...</div>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="theme-btn">🌙</button>
    </div>
  </div>

  <div style="padding:12px 20px 0">
    <div class="clockbar">
      <span class="cb-date" id="clock-date"></span>
      <span class="cb-time" id="clock-time"></span>
    </div>
  </div>

  <div style="padding:10px 20px 0">
    <div class="period-pill" id="period-pill">
      <span class="pill-dot"></span>
      <span id="period-name">—</span>
    </div>
  </div>

  <div style="padding:14px 20px 0">
    <div class="arc-wrapper">
      <svg class="arc-svg" viewBox="0 0 180 180">
        <defs>
          <filter id="glow-f">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path id="arc-track" class="arc-track"/>
        <path id="arc-glow" class="arc-fill" style="stroke:var(--accent);stroke-width:20;opacity:0.1;transition:stroke-dashoffset 0.8s cubic-bezier(0.34,1.2,0.64,1)"/>
        <path id="arc-fill" class="arc-fill"/>
        <circle id="arc-tip" r="6" fill="var(--accent)" opacity="0" style="filter:url(#glow-f);transition:opacity 0.4s"/>
      </svg>
      <div class="arc-center">
        <div class="arc-pct" id="arc-pct">0%</div>
        <div class="arc-lbl-bot" id="arc-lbl-bot">0 / 0</div>
      </div>
      <div class="arc-bottom">
        <div class="arc-stat">
          <div class="as-val accent" id="ab-done">0</div>
          <div class="as-lbl">tamamlanan</div>
        </div>
        <div class="arc-div"></div>
        <div class="arc-stat">
          <div class="as-val" id="ab-remaining">—</div>
          <div class="as-lbl">kalan</div>
        </div>
        <div class="arc-div"></div>
        <div class="arc-stat">
          <div class="as-val accent" id="ab-streak">0</div>
          <div class="as-lbl">gün serisi</div>
        </div>
      </div>
    </div>
  </div>

  <div class="goal-row">
    <div class="goal-label">Günlük hedef</div>
    <div class="goal-controls">
      <button class="goal-btn" id="goal-minus">−</button>
      <div class="goal-num" id="goal-disp">10</div>
      <button class="goal-btn" id="goal-plus">+</button>
    </div>
  </div>

  <div class="celebration" id="celebration">
    <div class="cel-icon">💪</div>
    <div class="cel-msg" id="cel-msg">HEDEFE ULAŞTIN!</div>
    <div class="cel-sub" id="cel-sub"></div>
  </div>

  <div class="list-section">
    <div class="section-title" id="active-title">Bekleyen push-uplar</div>
    <div id="card-list"></div>
  </div>

  <div class="history-section">
    <div class="history-card">
      <h3>📅 Geçmiş Tarih Girişi</h3>
      <div class="history-row">
        <input type="date" class="history-input date-inp" id="hist-date"/>
        <input type="number" class="history-input num-inp" id="hist-count" placeholder="adet" min="1" max="999" inputmode="numeric"/>
        <button class="btn-save" id="hist-save">Kaydet</button>
      </div>
      <div class="history-log" id="history-log"></div>
    </div>
  </div>

  <div class="actions-row">
    <button class="btn-action" id="reset-btn">🔄 Tur Ekle</button>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const KEY = 'pushup_swipe_v2';
let state = { goal: 10, days: {} };

function todayStr() { return new Date().toISOString().split('T')[0]; }
function dayData(k) { if (!state.days[k]) state.days[k] = { done:0, rounds:1 }; return state.days[k]; }
function todayData() { return dayData(todayStr()); }
function saveState() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function loadState() { try { const s=localStorage.getItem(KEY); if(s) state=Object.assign({goal:10,days:{}},JSON.parse(s)); } catch(e){} }

/* Audio */
let audioCtx=null;
function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
document.addEventListener('touchstart',()=>{try{const c=getCtx(),b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0);c.resume();}catch(e){}},{once:true});
function playDone(){try{const c=getCtx(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(659,t+0.1);o.frequency.setValueAtTime(784,t+0.2);g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);o.start(t);o.stop(t+0.5);}catch(e){}}
function playGoal(){try{const c=getCtx(),t=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.15,t+i*0.1);g.gain.exponentialRampToValueAtTime(0.001,t+i*0.1+0.4);o.start(t+i*0.1);o.stop(t+i*0.1+0.4);});}catch(e){}}

/* Toast */
let toastTimer=null;
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200);}

/* Fireworks */
function launchFireworks(el){const r=el.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;const colors=['#d4ff4e','#FF6B6B','#4ADE80','#60A5FA','#F472B6','#FB923C'];for(let i=0;i<24;i++){const p=document.createElement('div');const color=colors[i%colors.length];const angle=(i/24)*Math.PI*2;const speed=70+Math.random()*80;const size=Math.random()<0.5?6:4;p.style.cssText=`position:fixed;z-index:9998;pointer-events:none;left:${cx}px;top:${cy}px;width:${size*1.4}px;height:${size}px;border-radius:2px;background:${color};transform:translate(-50%,-50%) rotate(${Math.random()*360}deg);`;document.body.appendChild(p);const tx=Math.cos(angle)*speed*(0.7+Math.random()*0.6);const ty=Math.sin(angle)*speed*(0.7+Math.random()*0.6)-50;requestAnimationFrame(()=>{p.style.transition='transform 0.7s cubic-bezier(0.2,0.8,0.4,1),opacity 0.7s ease-in';p.style.transform=`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) rotate(${Math.random()*720-360}deg)`;p.style.opacity='0';});setTimeout(()=>p.remove(),750);}}

/* Theme */
let dark=true;
try{const s=localStorage.getItem('pu_theme');if(s)dark=s==='dark';}catch(e){}
function applyTheme(){document.documentElement.setAttribute('data-theme',dark?'dark':'light');document.getElementById('theme-btn').textContent=dark?'🌙':'☀️';try{localStorage.setItem('pu_theme',dark?'dark':'light');}catch(e){}}
applyTheme();
document.getElementById('theme-btn').addEventListener('click',()=>{dark=!dark;applyTheme();});

/* Arc */
const ARC={cx:90,cy:90,r:72,start:135,end:405};let arcLen=null;
function polarXY(deg,r){const rad=(deg-90)*Math.PI/180;return{x:ARC.cx+r*Math.cos(rad),y:ARC.cy+r*Math.sin(rad)};}
function arcPathD(s,e,r){const sp=polarXY(s,r),ep=polarXY(e,r);return`M ${sp.x} ${sp.y} A ${r} ${r} 0 ${(e-s)>180?1:0} 1 ${ep.x} ${ep.y}`;}
function initArc(){const path=arcPathD(ARC.start,ARC.end,ARC.r);['arc-track','arc-fill','arc-glow'].forEach(id=>document.getElementById(id).setAttribute('d',path));const fill=document.getElementById('arc-fill');arcLen=fill.getTotalLength();[fill,document.getElementById('arc-glow')].forEach(el=>{el.style.strokeDasharray=arcLen;el.style.strokeDashoffset=arcLen;});}
function updateArc(fraction){if(!arcLen)initArc();const c=Math.min(1,Math.max(0,fraction));const offset=arcLen*(1-c);const fill=document.getElementById('arc-fill');const glow=document.getElementById('arc-glow');const tip=document.getElementById('arc-tip');const pctEl=document.getElementById('arc-pct');fill.style.strokeDashoffset=offset;glow.style.strokeDashoffset=offset;if(c>0.005){const deg=ARC.start+(ARC.end-ARC.start)*c;const pos=polarXY(deg,ARC.r);tip.setAttribute('cx',pos.x);tip.setAttribute('cy',pos.y);tip.setAttribute('opacity','1');}else{tip.setAttribute('opacity','0');}if(c>=1){fill.classList.add('complete');pctEl.classList.add('complete');}else{fill.classList.remove('complete');pctEl.classList.remove('complete');}}

function calcStreak(){let streak=0;const d=new Date();d.setDate(d.getDate()-1);for(let i=0;i<90;i++){const k=d.toISOString().split('T')[0];const day=state.days[k];if(day&&day.done>=state.goal)streak++;else break;d.setDate(d.getDate()-1);}return streak;}
function getPeriod(){return new Date().getHours()<12?'morning':'afternoon';}
function todayTarget(){const td=todayData();return state.goal*(td.rounds||1);}

/* Render */
function render(){
  const td=todayData();const done=td.done;const target=todayTarget();
  const remaining=Math.max(0,target-done);const fraction=target>0?done/target:0;
  const pct=Math.round(fraction*100);

  document.getElementById('header-sub').textContent=done>=target?'// hedef tamamlandı 🎉':`// ${remaining} push-up kaldı`;
  document.getElementById('goal-disp').textContent=state.goal;
  document.getElementById('arc-pct').textContent=pct+'%';
  document.getElementById('arc-lbl-bot').textContent=done+' / '+target;
  updateArc(fraction);
  document.getElementById('ab-done').textContent=done;
  document.getElementById('ab-remaining').textContent=remaining>0?remaining:'✓';
  document.getElementById('ab-streak').textContent=calcStreak();

  const period=getPeriod();const pill=document.getElementById('period-pill');
  pill.className='period-pill '+(period==='morning'?'morning':'afternoon');
  document.getElementById('period-name').textContent=period==='morning'?'🌅 Sabah (00:00–11:59)':'🌆 Öğleden sonra (12:00–23:59)';

  const cardList=document.getElementById('card-list');const activeCount=remaining;
  document.getElementById('active-title').textContent=activeCount>0?`Bekleyen push-uplar (${activeCount})`:'Tüm push-uplar tamamlandı 🎉';

  if(activeCount===0){cardList.innerHTML='';}
  else{
    cardList.innerHTML=Array.from({length:activeCount},(_,i)=>{
      const num=done+i+1;
      return`<div class="item-wrap" id="pw-${i}"><div class="hint-bg hint-done"><span class="hint-icon">💪</span></div><div class="item" id="pi-${i}"><div class="push-num">${num}</div><div class="push-body"><div class="push-label">push-up</div></div><div class="swipe-arrow">›</div></div></div>`;
    }).join('');
    attachSwipe();
  }

  const rounds=td.rounds||1;
  document.getElementById('reset-btn').textContent=`🔄 Tur Ekle (${rounds}→${rounds+1}) +${state.goal} kart`;
  renderHistoryLog();
}

/* Swipe */
function attachSwipe(){
  const el=document.getElementById('pi-0');const wrap=document.getElementById('pw-0');
  if(!el||!wrap)return;
  const hintEl=wrap.querySelector('.hint-done');
  let sx=0,sy=0,cx=0,on=false,locked=false;
  function start(x,y){sx=x;sy=y;cx=0;on=true;locked=false;el.style.transition='none';}
  function move(x,y){if(!on)return;const dx=x-sx,dy=y-sy;if(!locked){if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>8){on=false;return;}if(Math.abs(dx)>8)locked=true;else return;}if(dx<0){el.style.transform='translateX(0)';if(hintEl)hintEl.style.opacity=0;return;}cx=dx;el.style.transform=`translateX(${dx}px)`;if(hintEl)hintEl.style.opacity=Math.min(1,dx/90);}
  function end(){if(!on&&!locked)return;on=false;if(cx>90)completePushup(el);else{el.style.transition='transform 0.25s cubic-bezier(0.4,0,0.2,1)';el.style.transform='translateX(0)';if(hintEl)hintEl.style.opacity=0;}}
  el.addEventListener('touchstart',e=>{const t=e.touches[0];start(t.clientX,t.clientY);},{passive:true});
  el.addEventListener('touchmove',e=>{if(!on)return;const t=e.touches[0];move(t.clientX,t.clientY);},{passive:true});
  el.addEventListener('touchend',end);
  el.addEventListener('mousedown',e=>{start(e.clientX,e.clientY);function mm(e2){move(e2.clientX,e2.clientY);}function mu(){end();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);}window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);});
}

function completePushup(el){
  const wrap=el.closest('.item-wrap');
  playDone();launchFireworks(el);
  el.style.transition='transform 0.32s cubic-bezier(0.4,0,0.2,1),opacity 0.32s';
  el.style.transform='translateX(450px)';el.style.opacity='0';
  if(wrap){wrap.style.transition='max-height 0.3s 0.28s,margin-bottom 0.3s 0.28s';wrap.style.maxHeight=wrap.offsetHeight+'px';wrap.style.overflow='hidden';setTimeout(()=>{wrap.style.maxHeight='0';wrap.style.marginBottom='0';},50);}
  setTimeout(()=>{
    const td=todayData();const target=todayTarget();
    td.done=Math.min(td.done+1,target);saveState();showToast('💪 +1 push-up!');
    if(td.done>=target)setTimeout(()=>celebrate(),300);
    render();
  },380);
}

function celebrate(){
  const el=document.getElementById('celebration');const td=todayData();
  document.getElementById('cel-msg').textContent='HEDEFE ULAŞTIN!';
  document.getElementById('cel-sub').textContent=`// ${td.done} push-up tamamlandı! Bravo!`;
  el.style.display='block';playGoal();setTimeout(()=>el.style.display='none',5000);
}

/* Reset — add a round */
document.getElementById('reset-btn').addEventListener('click',()=>{
  const td=todayData();const cur=td.rounds||1;
  if(!confirm(`Tur ${cur}→${cur+1}: ${state.goal} yeni kart eklenecek. Tamamlananlar korunur.`))return;
  td.rounds=cur+1;saveState();document.getElementById('celebration').style.display='none';
  render();showToast(`🔄 Tur ${cur+1} başladı! +${state.goal} kart eklendi`);
});

/* Goal */
document.getElementById('goal-minus').addEventListener('click',()=>{if(state.goal<=1)return;state.goal=Math.max(1,state.goal-1);saveState();render();});
document.getElementById('goal-plus').addEventListener('click',()=>{state.goal=Math.min(200,state.goal+1);saveState();render();});

/* History */
document.getElementById('hist-date').value=todayStr();
document.getElementById('hist-save').addEventListener('click',()=>{
  const dateVal=document.getElementById('hist-date').value;
  const countVal=parseInt(document.getElementById('hist-count').value);
  if(!dateVal){showToast('❌ Tarih seç');return;}
  if(!countVal||countVal<1){showToast('❌ Geçerli sayı gir');return;}
  const d=dayData(dateVal);d.done=(d.done||0)+countVal;
  if(!d.rounds)d.rounds=1;
  saveState();document.getElementById('hist-count').value='';
  showToast(`📅 ${dateVal}: ${countVal} push-up eklendi`);
  if(dateVal===todayStr())render();else renderHistoryLog();
});

function formatDateLabel(k){const d=new Date(k+'T12:00:00');return d.toLocaleDateString('tr-TR',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}

function renderHistoryLog(){
  const logEl=document.getElementById('history-log');
  const today=todayStr();
  const entries=Object.entries(state.days).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30);
  if(!entries.length){logEl.innerHTML='<div class="empty-done" style="padding:8px 0">// kayıt yok</div>';return;}
  logEl.innerHTML=entries.map(([k,v])=>{
    const isToday=k===today;
    const target=state.goal*(v.rounds||1);
    const pct=target>0?Math.round(v.done/target*100):0;
    const label=isToday?'Bugün':formatDateLabel(k);
    return`<div class="hlog-entry">
      <span class="hlog-date">${label}</span>
      <span class="hlog-goal">${v.done}/${target} (${pct}%)</span>
      <span class="hlog-count">${v.done}</span>
      <button class="hlog-del" data-date="${k}" title="Sil">✕</button>
    </div>`;
  }).join('');
  logEl.querySelectorAll('.hlog-del').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const k=btn.dataset.date;
      if(!confirm(`${formatDateLabel(k)} kaydı silinsin mi?`))return;
      delete state.days[k];saveState();
      if(k===todayStr())render();else renderHistoryLog();
      showToast('🗑️ Kayıt silindi');
    });
  });
}

/* Clock */
function updateClock(){const now=new Date();const d=document.getElementById('clock-date');const t=document.getElementById('clock-time');if(!d||!t)return;d.textContent=now.toLocaleDateString('tr-TR',{weekday:'short',day:'numeric',month:'long'});t.textContent=now.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}

loadState();
window.addEventListener('load',()=>{initArc();render();});
setInterval(updateClock,1000);
updateClock();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
</script>
</body>
</html>
